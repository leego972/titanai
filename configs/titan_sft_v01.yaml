# TitanAI v0.1 SFT Configuration — Instruction Fine-Tuning
# ===========================================================
# Purpose  : Fine-tune the Probe base checkpoint on Archibald cybersecurity
#            and Virelle cinema instruction data. Teaches Titan his two roles.
# Input    : checkpoints/probe_v015/final.pt (or any base model checkpoint)
# Output   : checkpoints/sft_v01/final.pt (instruction-tuned Titan)
#
# Run with:
#   python scripts/sft_train.py --config configs/titan_sft_v01.yaml \
#       --checkpoint checkpoints/probe_v015/final.pt

project:
  name: "titan-sft"
  version: "0.1.0"

data:
  sft_files:
    - "data/sft/archibald_cybersecurity.jsonl"
    - "data/sft/virelle_cinema.jsonl"
  tokenizer_path: "tokenizer/artifacts_v32k/tokenizer.json"
  val_split: 0.1
  num_workers: 2

model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 512
  n_heads: 8
  n_layers: 8
  d_ff: 2048
  max_seq_len: 2048
  dropout: 0.05
  tie_embeddings: true

training:
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_steps: 500
  warmup_steps: 50
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 10
  eval_interval: 100
  save_interval: 200
  checkpoint_dir: "checkpoints/sft_v01"

evaluation:
  val_batch_size: 4
  num_eval_batches: 10

logging:
  log_dir: "logs/sft_v01"
  experiment_name: "titan-sft-v0.1"

tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000

inference:
  default_max_new_tokens: 512
  default_temperature: 0.8
  default_top_k: 50
  default_top_p: 0.95
