stage: sft
base_checkpoint: checkpoints/crucible_v02/final.pt

model:
  layers: 12
  heads: 12
  d_model: 768
  d_ff: 3072
  vocab_size: 32000
  context_length: 2048

training:
  epochs: 3
  batch_size: 8
  grad_accum: 8
  learning_rate: 2.0e-05
  lr_scheduler: cosine
  warmup_steps: 200
  weight_decay: 0.01
  clip_grad_norm: 1.0

data:
  format: alpaca
  max_length: 2048
  train_split: 0.95
  val_split: 0.05

output:
  checkpoint_dir: checkpoints/sft_v01/
  log_dir: logs/sft_v01/
  save_every: 1000
  eval_every: 500
