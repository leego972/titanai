# TitanAI 1B — Inference SFT v2 controlled run
# ==============================================
# Purpose: evaluate the new inference corpus independently before it is given
# a large weight in the production all-domain SFT mix.
#
# Important: validation.jsonl is explicitly held out. test.jsonl is never used
# by training and is reserved for final evaluation.

project:
  name: titan-1b-sft-inference-v2
  version: 2.0.0

model:
  architecture: decoder_transformer
  vocab_size: 32000
  d_model: 2048
  n_heads: 16
  n_kv_heads: 4
  n_layers: 24
  d_ff: 8192
  max_seq_len: 2048
  rope_base: 10000.0
  dropout: 0.05
  tie_embeddings: true
  gradient_checkpointing: true

data:
  sft_files:
    - data/sft/titan_inference_v2/train-00001-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00002-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00003-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00004-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00005-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00006-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00007-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00008-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00009-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00010-of-00010.jsonl
  val_files:
    - data/sft/titan_inference_v2/validation.jsonl
  tokenizer_path: tokenizer/artifacts_v32k/tokenizer.json
  split_seed: 1337
  num_workers: 4

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-06
  weight_decay: 0.01
  max_steps: 6000
  warmup_steps: 200
  lr_scheduler: cosine
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 10
  eval_interval: 250
  save_interval: 500
  checkpoint_dir: checkpoints/titan_1b_sft_inference_v2
  early_stop_patience: 8
  use_8bit_adam: true
  bf16: true

evaluation:
  val_batch_size: 1
  num_eval_batches: 100
  held_out_test_file: data/sft/titan_inference_v2/test.jsonl

logging:
  log_dir: logs/titan_1b_sft_inference_v2
  experiment_name: titan-1b-sft-inference-v2
