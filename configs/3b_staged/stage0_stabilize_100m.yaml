# TitanAI 3B staged training — Stage 0
# Goal: stabilize the 1B→3B expansion cheaply before committing serious GPU spend.
project:
  name: "titan-3b-stage0-stabilize"
  version: "1.0.0"
model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 2048
  n_heads: 16
  n_kv_heads: 4
  n_layers: 66
  d_ff: 8192
  max_seq_len: 2048
  rope_base: 500000.0
  dropout: 0.05
  tie_embeddings: true
  gradient_checkpointing: true
  use_flash_attention: true
training:
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-5
  weight_decay: 0.05
  target_tokens: 100000000
  max_steps: 3052
  warmup_steps: 200
  lr_scheduler: "cosine"
  lr_min_ratio: 0.20
  clip_grad_norm: 1.0
  log_interval: 25
  eval_interval: 250
  save_interval: 500
  checkpoint_dir: "checkpoints/titan_3b_stage0"
  use_8bit_adam: true
  use_compile: true
  bf16: true
  resume_from: null
tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000
data:
  processed_dir: "data/processed"
  max_seq_len: 2048
evaluation:
  val_batch_size: 1
  num_eval_batches: 32
logging:
  log_dir: "logs/titan_3b_stage0"
  experiment_name: "titan-3b-stage0-stabilize-100m"
