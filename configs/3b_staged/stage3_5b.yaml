# TitanAI 3B staged training — Stage 3
# Cumulative target: 5B tokens. Recommended minimum serious base-model checkpoint before SFT if funds are constrained.
project:
  name: "titan-3b-stage3-5b"
  version: "1.0.0"
model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 2048
  n_heads: 16
  n_kv_heads: 4
  n_layers: 66
  d_ff: 8192
  max_seq_len: 2048
  rope_base: 500000.0
  dropout: 0.05
  tie_embeddings: true
  gradient_checkpointing: true
  use_flash_attention: true
training:
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 6.0e-5
  weight_decay: 0.05
  target_tokens: 5000000000
  max_steps: 152588
  warmup_steps: 1000
  lr_scheduler: "cosine"
  lr_min_ratio: 0.10
  clip_grad_norm: 1.0
  log_interval: 25
  eval_interval: 1500
  save_interval: 3000
  checkpoint_dir: "checkpoints/titan_3b_stage3"
  use_8bit_adam: true
  use_compile: true
  bf16: true
  resume_from: null
tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000
data:
  processed_dir: "data/processed"
  max_seq_len: 2048
evaluation:
  val_batch_size: 1
  num_eval_batches: 64
logging:
  log_dir: "logs/titan_3b_stage3"
  experiment_name: "titan-3b-stage3-5b"
