  tokenizer_path: tokenizer/artifacts_v32k/tokenizer.json
  val_split: 0.05
  num_workers: 4
training:
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-06
  weight_decay: 0.01
  max_steps: 20000
  warmup_steps: 200
  lr_scheduler: cosine
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 1
  eval_interval: 500
  save_interval: 1000
  checkpoint_dir: checkpoints/titan_1b_sft_all
  use_8bit_adam: true
  bf16: true
evaluation:
  val_batch_size: 1
  num_eval_batches: 50
logging:
  log_dir: logs/titan_1b_sft_all
  experiment_name: titan-1b-sft-all
