# TitanAI 1B — Production SFT recipe
# Dataset-quality checkpoint: 2026-08-11
#
# Deliberately excludes:
# - hackersignal_benchmark.jsonl (evaluation only)
# - data/new_data/* stale paths
# - zero-byte placeholders
# - known-bad upgrade_system_design.jsonl
#
# Inference v2 test.jsonl remains untouched for final evaluation.

project:
  name: titan-1b-sft-production
  version: 1.1.0

model:
  architecture: decoder_transformer
  vocab_size: 32000
  d_model: 2048
  n_heads: 16
  n_kv_heads: 4
  n_layers: 24
  d_ff: 8192
  max_seq_len: 2048
  rope_base: 500000.0
  dropout: 0.05
  tie_embeddings: true
  gradient_checkpointing: true

data:
  tokenizer_path: tokenizer/artifacts_v32k/tokenizer.json
  sft_files:
    # Product/domain behaviour — verified non-empty in repository.
    - data/sft/archibald_cybersecurity.jsonl
    - data/sft/virelle_cinema.jsonl

    # Source-grounded professional system-design replacement.
    - data/upgrades/upgrade_system_design_v2.jsonl

    # Useful advanced programming legacy set; retained at low natural weight
    # because it is small relative to inference v2. Scheduled for provenance-v2 rebuild.
    - data/upgrades/upgrade_programming_expanded.jsonl

    # Titan Inference SFT v2 — train shards only.
    - data/sft/titan_inference_v2/train-00001-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00002-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00003-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00004-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00005-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00006-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00007-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00008-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00009-of-00010.jsonl
    - data/sft/titan_inference_v2/train-00010-of-00010.jsonl

  # Explicit held-out validation; test.jsonl is never loaded here.
  val_files:
    - data/sft/titan_inference_v2/validation.jsonl

  val_split: 0.05
  split_seed: 1337
  num_workers: 4

training:
  batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_steps: 12000
  warmup_steps: 400
  lr_scheduler: cosine
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 25
  eval_interval: 250
  save_interval: 500
  checkpoint_dir: checkpoints/titan_1b_sft_production
  use_8bit_adam: true
  bf16: true

evaluation:
  val_batch_size: 1
  num_eval_batches: 100

logging:
  log_dir: logs/titan_1b_sft_production
  experiment_name: titan-1b-sft-production-v1
  wandb:
    enabled: false
    project: titanai

inference:
  default_max_new_tokens: 700
  default_temperature: 0.6
