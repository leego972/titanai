# Titan Base Model Configuration
# All major hyperparameters and paths are defined here.
# Change this file to reconfigure training without touching code.

project:
  name: "titan-base"
  version: "0.1.0"

tokenizer:
  type: "bpe"                      # Byte-Pair Encoding
  vocab_size: 8000                 # Small vocab for initial pipeline validation
  min_frequency: 2
  special_tokens:
    - "<pad>"
    - "<unk>"
    - "<bos>"
    - "<eos>"
    - "<sep>"
    - "<mask>"
  save_dir: "tokenizer/artifacts"
  corpus_file: "data/raw/corpus.txt"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  train_split: 0.95
  val_split: 0.05
  max_seq_len: 256                 # Context length for initial training
  stride: 128                      # Stride for sliding window tokenization
  shard_size: 10000                # Tokens per shard file

model:
  architecture: "decoder_transformer"
  vocab_size: 8000                 # Must match tokenizer vocab_size
  d_model: 256                     # Embedding dimension
  n_heads: 4                       # Attention heads
  n_layers: 4                      # Transformer layers
  d_ff: 1024                       # Feed-forward dimension (4x d_model)
  max_seq_len: 256
  dropout: 0.1
  tie_embeddings: true             # Tie input/output embeddings (saves params)

training:
  batch_size: 32
  gradient_accumulation_steps: 4  # Effective batch = 128
  learning_rate: 3.0e-4
  weight_decay: 0.1
  max_steps: 5000                  # Steps for initial pipeline validation
  warmup_steps: 200
  lr_scheduler: "cosine"
  clip_grad_norm: 1.0
  eval_interval: 500               # Evaluate every N steps
  save_interval: 500               # Save checkpoint every N steps
  log_interval: 50                 # Log metrics every N steps
  checkpoint_dir: "checkpoints"
  resume_from: null                # Set to checkpoint path to resume

evaluation:
  val_batch_size: 32
  num_eval_batches: 20
  generate_samples: 3              # Number of sample generations during eval
  sample_max_new_tokens: 100
  sample_temperature: 0.8
  sample_top_k: 40

inference:
  default_max_new_tokens: 200
  default_temperature: 0.8
  default_top_k: 50
  default_top_p: 0.95

logging:
  log_dir: "logs"
  experiment_name: "titan-base-v0.1"
