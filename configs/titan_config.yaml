# TitanAI Base Model Configuration — v2
# =========================================
# Single source of truth for all hyperparameters and paths.
# This is the DEVELOPMENT / VALIDATION config (small model, small run).
# For production training runs, use:
#   configs/titan_probe_v015.yaml   — Titan v0.1.5 "The Probe" (45M params, 1B tokens)
#   configs/titan_crucible_v02.yaml — Titan v0.2 "The Crucible" (125M params, 5B tokens)

project:
  name: "titan-base"
  version: "0.1.0"

tokenizer:
  type: "bpe"
  vocab_size: 8000
  min_frequency: 2
  special_tokens:
    - "<pad>"
    - "<unk>"
    - "<bos>"
    - "<eos>"
    - "<sep>"
    - "<mask>"
  save_dir: "tokenizer/artifacts"
  corpus_file: "data/raw/tinyshakespeare.txt"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  train_split: 0.98
  val_split: 0.02
  max_seq_len: 256
  stride: 128
  shard_size: 10000

model:
  architecture: "decoder_transformer"
  vocab_size: 8000
  d_model: 256
  n_heads: 4
  n_layers: 4
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  tie_embeddings: true

training:
  batch_size: 32
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  weight_decay: 0.1
  max_steps: 5000
  warmup_steps: 200
  lr_scheduler: "cosine"
  clip_grad_norm: 1.0   # max gradient norm (enforced, must be > 0)
  eval_interval: 500
  save_interval: 500
  log_interval: 50
  checkpoint_dir: "checkpoints"
  resume_from: null

evaluation:
  val_batch_size: 32
  num_eval_batches: 20
  generate_samples: 3
  sample_max_new_tokens: 100
  sample_temperature: 0.8
  sample_top_k: 40

inference:
  default_max_new_tokens: 200
  default_temperature: 0.8
  default_top_k: 50
  default_top_p: 0.95

logging:
  log_dir: "logs"
  experiment_name: "titan-base-v0.1"
