stage: dpo
base_checkpoint: checkpoints/tool_v01/final.pt

model:
  layers: 12
  heads: 12
  d_model: 768
  d_ff: 3072
  vocab_size: 32000
  context_length: 2048

dpo:
  beta: 0.1
  reference_model: checkpoints/tool_v01/final.pt

training:
  epochs: 2
  batch_size: 2
  grad_accum: 16
  learning_rate: 5.0e-06
  lr_scheduler: cosine
  warmup_steps: 50
  weight_decay: 0.01
  clip_grad_norm: 1.0

data:
  format: dpo
  max_length: 2048
  train_split: 0.95
  val_split: 0.05

output:
  checkpoint_dir: checkpoints/dpo_v01/
  log_dir: logs/dpo_v01/
  save_every: 500
  eval_every: 250
