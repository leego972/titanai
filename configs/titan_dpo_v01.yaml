# TitanAI DPO v0.1 — Direct Preference Optimization
# ====================================================
# Purpose  : Alignment pass using DPO (Direct Preference Optimization).
#            Teaches Titan to prefer better responses over worse ones
#            without requiring a separate reward model.
#
# DPO replaces RLHF at a fraction of the compute cost. It uses pairs of
# (chosen, rejected) responses to the same prompt and optimizes the model
# to increase the likelihood ratio of chosen over rejected.
#
# Input    : checkpoints/sft_v02/final.pt (instruction-tuned model)
# Output   : checkpoints/dpo_v01/final.pt (aligned model)
#
# Run with:
#   python scripts/run_dpo.py --config configs/titan_dpo_v01.yaml \
#       --checkpoint checkpoints/sft_v02/final.pt
#
# Cost estimate (RTX 4090, ~$0.42/hr):
#   ~3,000 steps | ~4–6 hours | ~$2–3

project:
  name: "titan-dpo"
  version: "0.1.0"

data:
  dpo_files:
    - "data/dpo/preference_pairs.jsonl"
  tokenizer_path: "tokenizer/artifacts_v32k/tokenizer.json"
  val_split: 0.05
  max_seq_len: 1024
  num_workers: 4

model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 768
  n_heads: 12
  n_layers: 12
  d_ff: 3072
  max_seq_len: 2048
  dropout: 0.0                          # No dropout during DPO
  tie_embeddings: true

training:
  batch_size: 2
  gradient_accumulation_steps: 8        # Effective batch = 16 pairs
  learning_rate: 5.0e-7                 # Very conservative for alignment
  weight_decay: 0.0
  max_steps: 3000
  warmup_steps: 100
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  beta: 0.1                             # DPO temperature: controls divergence from SFT model
  log_interval: 25
  eval_interval: 300
  save_interval: 500
  checkpoint_dir: "checkpoints/dpo_v01"
  reference_model: "checkpoints/sft_v02/final.pt"  # Frozen reference model for KL

evaluation:
  val_batch_size: 2
  num_eval_batches: 30

logging:
  log_dir: "logs/dpo_v01"
  experiment_name: "titan-dpo-v0.1"

tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000

inference:
  default_max_new_tokens: 512
  default_temperature: 0.7
  default_top_k: 50
  default_top_p: 0.95
