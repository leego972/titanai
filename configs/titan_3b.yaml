# Compatibility copy of the canonical root titan_3b.yaml.
# Architecture: depth-scaled Titan 1B, 2048 width and 66 transformer layers.
project:
  name: "titan-3b"
  version: "1.0.0"

model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 2048
  n_heads: 16
  n_kv_heads: 4
  n_layers: 66
  d_ff: 8192
  max_seq_len: 2048
  rope_base: 500000.0
  dropout: 0.05
  tie_embeddings: true
  gradient_checkpointing: false
  use_flash_attention: true

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  target_tokens: 40000000000
  max_steps: 152588
  warmup_steps: 500
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 100
  eval_interval: 2000
  save_interval: 5000
  checkpoint_dir: "checkpoints/titan_3b_pretrain"
  use_8bit_adam: true
  use_compile: true
  bf16: true
  resume_from: null

tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000

data:
  processed_dir: "data/processed"
  max_seq_len: 2048

evaluation:
  val_batch_size: 4
  num_eval_batches: 50
  perplexity_threshold: 10.0

logging:
  log_dir: "logs/titan_3b"
  experiment_name: "titan-3b-pretrain-v1-depth-scaled"
  wandb:
    enabled: false
    project: "titanai"

inference:
  default_max_new_tokens: 512
  default_temperature: 0.7
  default_top_k: 50
  default_top_p: 0.95
