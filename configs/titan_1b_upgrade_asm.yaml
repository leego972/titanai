data:
  num_workers: 4
  sft_files:
  - /workspace/data_upgrades/upgrade_asm.jsonl
  tokenizer_path: tokenizer/artifacts_v32k/tokenizer.json
  val_split: 0.05
evaluation:
  num_eval_batches: 50
  val_batch_size: 2
logging:
  experiment_name: titan-1b-upgrade-asm
  log_dir: logs/titan_1b/upgrade_asm
model:
  architecture: decoder_transformer
  d_ff: 8192
  d_model: 2048
  dropout: 0.05
  max_seq_len: 1024
  n_heads: 16
  n_kv_heads: 4
  n_layers: 24
  tie_embeddings: true
  vocab_size: 32000
project:
  name: titan-1b-upgrade-asm
  version: 1.0.0
tokenizer:
  path: tokenizer/artifacts_v32k/tokenizer.json
  vocab_size: 32000
training:
  batch_size: 4
  checkpoint_dir: checkpoints/titan_1b/upgrade_asm
  clip_grad_norm: 1.0
  early_stop_patience: 10
  eval_interval: 500
  gradient_accumulation_steps: 4
  gradient_checkpointing: false
  learning_rate: 2.0e-05
  log_interval: 50
  lr_min_ratio: 0.1
  lr_scheduler: cosine
  max_steps: 1500
  save_interval: 1000
  warmup_steps: 75
  weight_decay: 0.01
