stage: tool_use
base_checkpoint: checkpoints/sft_v01/final.pt

model:
  layers: 12
  heads: 12
  d_model: 768
  d_ff: 3072
  vocab_size: 32000
  context_length: 4096

training:
  epochs: 5
  batch_size: 4
  grad_accum: 16
  learning_rate: 1.0e-05
  lr_scheduler: cosine
  warmup_steps: 100
  weight_decay: 0.01
  clip_grad_norm: 1.0

data:
  format: tool_use
  system_prompt: "You are Titan, an agentic AI assistant. When you need to use a tool, output a JSON tool_call block. Think step by step."
  max_length: 4096
  train_split: 0.95
  val_split: 0.05

output:
  checkpoint_dir: checkpoints/tool_v01/
  log_dir: logs/tool_v01/
  save_every: 500
  eval_every: 250
