# TitanAI Tool-Use Fine-Tuning v0.1
# =====================================
# Purpose  : Supervised fine-tuning on agentic / tool-use formatted data.
#            Runs AFTER the SFT v2 stage using the sft_v02 checkpoint.
#
# Input    : checkpoints/sft_v02/final.pt  (instruction-tuned model)
# Output   : checkpoints/tool_v01/final.pt
#
# Run with:
#   python scripts/run_tool_tuning.py --config configs/titan_tool_v01.yaml \
#       --checkpoint checkpoints/sft_v02/final.pt
#
# Data format (chat JSONL with tool-use examples):
#   {"messages": [
#     {"role": "system",    "content": "You are Titan, an agentic AI..."},
#     {"role": "user",      "content": "Search for the latest Python release"},
#     {"role": "assistant", "content": "{\"tool_call\": {\"name\": \"web_search\", ...}}"}
#   ]}

project:
  name: "titan-tool"
  version: "0.1.0"

data:
  sft_files:
    - "data/sft/tool_use.jsonl"
  tokenizer_path: "tokenizer/artifacts_v32k/tokenizer.json"
  val_split: 0.05
  num_workers: 2

model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 768
  n_heads: 12
  n_layers: 12
  d_ff: 3072
  max_seq_len: 4096
  dropout: 0.05
  tie_embeddings: true

training:
  batch_size: 4
  gradient_accumulation_steps: 16        # Effective batch = 64 sequences
  learning_rate: 1.0e-5                  # Higher than SFT: smaller tool dataset
  weight_decay: 0.01
  max_steps: 10000
  warmup_steps: 100
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 25
  eval_interval: 250
  save_interval: 500
  checkpoint_dir: "checkpoints/tool_v01"
  early_stop_patience: 10

evaluation:
  val_batch_size: 4
  num_eval_batches: 20

logging:
  log_dir: "logs/tool_v01"
  experiment_name: "titan-tool-v0.1"

tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000

inference:
  default_max_new_tokens: 512
  default_temperature: 0.8
  default_top_k: 50
  default_top_p: 0.95
