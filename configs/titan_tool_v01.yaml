# TitanAI v0.1 Tool-Use Configuration
# ======================================
# Purpose  : Fine-tune on tool-use (agentic) data after SFT stage.
# Input    : checkpoints/sft_v01/final.pt
# Output   : checkpoints/tool_v01/final.pt

project:
  name: "titan-tool"
  version: "0.1.0"

stage: tool_use
base_checkpoint: checkpoints/sft_v01/final.pt

tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000

model:
  layers: 12
  heads: 12
  d_model: 768
  d_ff: 3072
  vocab_size: 32000
  context_length: 4096

data:
  format: tool_use
  system_prompt: "You are Titan, an agentic AI assistant. When you need to use a tool, output a JSON tool_call block. Think step by step."
  max_length: 4096
  train_split: 0.95
  val_split: 0.05

training:
  epochs: 5
  batch_size: 4
  grad_accum: 16
  learning_rate: 1.0e-5
  lr_scheduler: cosine
  warmup_steps: 100
  weight_decay: 0.01
  clip_grad_norm: 1.0
  max_steps: 10000

evaluation:
  val_batch_size: 4
  num_eval_batches: 20

inference:
  default_max_new_tokens: 512
  default_temperature: 0.8
  default_top_k: 50
  default_top_p: 0.95

logging:
  log_dir: "logs/tool_v01"
  experiment_name: "titan-tool-v0.1"

output:
  checkpoint_dir: checkpoints/tool_v01/
  save_every: 500
  eval_every: 250
