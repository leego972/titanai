# TitanAI v0.2 "The Crucible" — Training Configuration
# =========================================================
# Purpose  : First serious pretraining run. Establishes Titan as a domain-competent
#            base model ready for instruction tuning.
# Scale    : 125M parameters | 5B tokens | Multi-GPU (2–4x A100 80GB recommended)
#
# GATE: This config MUST NOT be used unless Probe v0.1.5 has passed ALL criteria:
#   - Final validation perplexity < 30
#   - Evaluation suite pass rate >= 60%
#   - No NaN/Inf loss events after step 500
#   - Cybersecurity boundary gate: 0 failures on prohibited prompts
#   - Training curve is monotonically decreasing after warmup
#
# Compute estimates (approved in Advancement Package v2, Section 7):
#   GPU hours         : ~200–280h on 4x A100 80GB | ~600–900h on single A100
#   Storage           : ~40GB raw corpus + ~60GB processed shards + ~10GB checkpoints
#   Token throughput  : ~700K tokens/sec (4x A100 with DDP)
#   Estimated cost    : $400–$1,200 (cloud 4x A100) | $150–$400 (cloud single A100)
#   Budget ceiling    : $1,500 hard cap. If projected cost exceeds $1,500, STOP and review.
#   Preferred config  : 4x A100 80GB, ~200h, ~$800 estimated.
#
# Corpus version: v1.0.0 (5B tokens, ratios A:35% B:15% C:20% D:20% E:10%)

project:
  name: "titan-crucible"
  version: "0.2.0"

tokenizer:
  type: "bpe"
  vocab_size: 32000
  min_frequency: 3
  special_tokens:
    - "<pad>"
    - "<unk>"
    - "<bos>"
    - "<eos>"
    - "<sep>"
    - "<mask>"
  save_dir: "tokenizer/artifacts_v32k"
  corpus_file: null

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  corpus_version: "v1.0.0"
  train_split: 0.98
  val_split: 0.02
  max_seq_len: 2048
  stride: 1024
  shard_size: 10000

model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 768
  n_heads: 12
  n_layers: 12
  d_ff: 3072
  max_seq_len: 2048
  dropout: 0.1
  tie_embeddings: true
  # Approximate parameter count:
  # Embedding: 32000 * 768 = 24.6M (tied)
  # Per layer: attn(768*768*4) + ff(768*3072*2) = ~6.9M
  # 12 layers: ~82.8M
  # Total: ~125M params

training:
  batch_size: 32
  gradient_accumulation_steps: 4     # Effective batch = 512 sequences (per GPU)
  learning_rate: 2.0e-4
  weight_decay: 0.1
  max_steps: 76294                   # 5B tokens / (512 seq * 2048 tok) ≈ 4768 steps per epoch; ~16 epochs
  warmup_steps: 2000
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1
  grad_clip: 1.0
  clip_grad_norm: 1.0
  eval_interval: 2000
  save_interval: 5000
  log_interval: 200
  checkpoint_dir: "checkpoints/crucible_v02"
  resume_from: null
  # DDP: ENABLED for Crucible (multi-GPU)
  ddp: true
  ddp_backend: "nccl"               # Use "gloo" for CPU-only testing

evaluation:
  val_batch_size: 16
  num_eval_batches: 100
  generate_samples: 5
  sample_max_new_tokens: 300
  sample_temperature: 0.8
  sample_top_k: 50
  sample_top_p: 0.95
  # Post-Crucible gate thresholds (before instruction tuning is approved)
  perplexity_threshold: 15.0
  suite_pass_rate_threshold: 0.80

inference:
  default_max_new_tokens: 512
  default_temperature: 0.8
  default_top_k: 50
  default_top_p: 0.95

logging:
  log_dir: "logs/crucible_v02"
  experiment_name: "titan-crucible-v0.2"
