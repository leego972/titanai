data:
  num_workers: 2
  sft_files:
  - data/upgrades/upgrade_an.jsonl
  tokenizer_path: tokenizer/artifacts_v32k/tokenizer.json
  val_split: 0.0
evaluation:
  num_eval_batches: 10
  val_batch_size: 2
inference:
  default_max_new_tokens: 512
  default_temperature: 0.7
  default_top_k: 50
  default_top_p: 0.95
logging:
  experiment_name: titan-upgrade-an-owner-loyalty
  log_dir: logs/upgrade_an
model:
  architecture: decoder_transformer
  d_ff: 3072
  d_model: 768
  dropout: 0.1
  max_seq_len: 2048
  n_heads: 12
  n_layers: 12
  tie_embeddings: true
  vocab_size: 32000
project:
  name: titan-upgrade-an
  version: 1.0.0
tokenizer:
  path: tokenizer/artifacts_v32k/tokenizer.json
  vocab_size: 32000
training:
  batch_size: 2
  checkpoint_dir: checkpoints/upgrade_an
  clip_grad_norm: 1.0
  early_stop_patience: 8
  eval_interval: 500
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-06
  log_interval: 10
  lr_min_ratio: 0.1
  lr_scheduler: cosine
  max_steps: 5000
  save_interval: 500
  warmup_steps: 200
  weight_decay: 0.0
