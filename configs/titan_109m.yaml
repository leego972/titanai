# TitanAI 109M — Pre-trained Base Config
# Architecture: d_model=768, n_heads=12, n_layers=12, d_ff=3072 (~109M params)
# Requirements: A100 40GB | 8-bit Adam | gradient checkpointing | batch=4 accum=8
project:
  name: "titan-109m"
  version: "1.0.0"
model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 768
  n_heads: 12
  n_layers: 12
  d_ff: 3072
  max_seq_len: 2048
  dropout: 0.1
  tie_embeddings: true
  gradient_checkpointing: true
training:
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-4
  weight_decay: 0.01
  max_steps: 100000
  warmup_steps: 2000
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 50
  eval_interval: 500
  save_interval: 2000
  checkpoint_dir: "checkpoints/titan_109m_pretrain"
  use_8bit_adam: true
tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000
data:
  processed_dir: "data/processed"
  max_seq_len: 2048
evaluation:
  val_batch_size: 4
  num_eval_batches: 50
logging:
  log_dir: "logs/titan_109m"
  experiment_name: "titan-109m-pretrain"
inference:
  default_max_new_tokens: 512
  default_temperature: 0.7
  default_top_k: 50
  default_top_p: 0.95
