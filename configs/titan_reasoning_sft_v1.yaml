# TitanAI Complex Commonsense + Longitudinal Reflection SFT v1
# Original curated examples for practical inference, uncertainty calibration,
# memory, reflection, belief revision, and efficient clarification.

project:
  name: "titan-reasoning-sft-v1"
  version: "1.0.0"

data:
  sft_files:
    - "data/sft/titan_complex_commonsense_v1.jsonl"
    - "data/sft/titan_longitudinal_reflection_v1.jsonl"
  tokenizer_path: "tokenizer/artifacts_v32k/tokenizer.json"
  val_split: 0.10
  num_workers: 2

model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 768
  n_heads: 12
  n_layers: 12
  d_ff: 3072
  max_seq_len: 2048
  dropout: 0.05
  tie_embeddings: true

training:
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-6
  weight_decay: 0.01
  max_steps: 1200
  warmup_steps: 80
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 20
  eval_interval: 200
  save_interval: 300
  checkpoint_dir: "checkpoints/reasoning_sft_v1"

evaluation:
  val_batch_size: 4
  num_eval_batches: 25

logging:
  log_dir: "logs/reasoning_sft_v1"
  experiment_name: "titan-reasoning-sft-v1"

tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000

inference:
  default_max_new_tokens: 512
  default_temperature: 0.6
  default_top_k: 50
  default_top_p: 0.95
