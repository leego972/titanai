  val_split: 0.05
  num_workers: 4
training:
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-05
  weight_decay: 0.01
  max_steps: 15000
  warmup_steps: 300
  lr_scheduler: cosine
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 50
  eval_interval: 500
  save_interval: 1000
  checkpoint_dir: checkpoints/upgrades_all
  bf16: true
evaluation:
  val_batch_size: 4
  num_eval_batches: 30
logging:
