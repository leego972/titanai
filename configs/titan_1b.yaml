# TitanAI 1B — Intermediate Upscale Config
# Architecture: d_model=2048, n_heads=16, n_layers=24, d_ff=8192 (~1B params)
# Requirements: A100 40GB | 8-bit Adam | gradient checkpointing | batch=1 accum=16
project:
  name: "titan-1b"
  version: "1.0.0"
model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 2048
  n_heads: 16
  n_layers: 24
  d_ff: 8192
  max_seq_len: 2048
  dropout: 0.05
  tie_embeddings: true
  gradient_checkpointing: true
training:
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-5
  weight_decay: 0.01
  max_steps: 20000
  warmup_steps: 500
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 50
  eval_interval: 500
  save_interval: 2000
  checkpoint_dir: "checkpoints/titan_1b_pretrain"
  use_8bit_adam: true
tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000
data:
  processed_dir: "data/processed"
  max_seq_len: 2048
evaluation:
  val_batch_size: 1
  num_eval_batches: 50
logging:
  log_dir: "logs/titan_1b"
  experiment_name: "titan-1b-pretrain"
inference:
  default_max_new_tokens: 512
  default_temperature: 0.7
  default_top_k: 50
  default_top_p: 0.95
