project:
  name: titan-1b-upgrade-c
  version: 1.0.0
model:
  architecture: decoder_transformer
  vocab_size: 32000
  d_model: 2048
  n_heads: 16
  n_layers: 24
  d_ff: 8192
  max_seq_len: 1024
  dropout: 0.05
  tie_embeddings: true
tokenizer:
  path: tokenizer/artifacts_v32k/tokenizer.json
  vocab_size: 32000
data:
  sft_files:
  - /workspace/data_upgrades/upgrade_c.jsonl
  tokenizer_path: tokenizer/artifacts_v32k/tokenizer.json
  val_split: 0.05
  num_workers: 4
training:
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-05
  weight_decay: 0.01
  max_steps: 8000
  warmup_steps: 400
  lr_scheduler: cosine
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 50
  eval_interval: 500
  save_interval: 1000
  early_stop_patience: 10
  gradient_checkpointing: false
  checkpoint_dir: /workspace/ckpt_1b/upgrade_c
evaluation:
  val_batch_size: 2
  num_eval_batches: 50
logging:
  log_dir: logs/titan_1b/upgrade_c
  experiment_name: titan-1b-upgrade-c
inference:
  default_max_new_tokens: 512
  default_temperature: 0.7
  default_top_k: 50
  default_top_p: 0.95
