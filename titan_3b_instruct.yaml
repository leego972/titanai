# TitanAI 3B — Instruction Fine-tuning Config
# Canonical architecture matches root titan_3b.yaml (2048 width, 66 layers).
project:
  name: "titan-3b-instruct"
  version: "1.0.0"

model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 2048
  n_heads: 16
  n_kv_heads: 4
  n_layers: 66
  d_ff: 8192
  max_seq_len: 2048
  rope_base: 500000.0
  dropout: 0.05
  tie_embeddings: true
  gradient_checkpointing: true

training:
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 5000
  batch_size: 1
  gradient_accumulation_steps: 32
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1
  checkpoint_dir: "checkpoints/titan_3b_instruct"
  clip_grad_norm: 1.0
  log_interval: 50
  eval_interval: 500
  save_interval: 1000
  bf16: true

data:
  tokenizer_path: "tokenizer/artifacts_v32k/tokenizer.json"
  sft_files:
    - "data/sft/knowledge_base_cyber_film.jsonl"
    - "data/sft/alpaca_cleaned.jsonl"
    - "data/sft/dolly_15k.jsonl"
  max_seq_len: 2048
  val_split: 0.05
  split_seed: 1337
  num_workers: 2

evaluation:
  val_batch_size: 1
  num_eval_batches: 20

logging:
  log_dir: "logs/titan_3b_instruct"
  experiment_name: "titan-3b-instruct-v1"
  wandb:
    enabled: false
    project: "titanai-instruct"

inference:
  default_max_new_tokens: 700
  default_temperature: 0.6
