[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
TITAN_HF_REPO_ID = "leego982/titanai"
TITAN_HF_FILENAME = "final.pt"
TITAN_CHECKPOINT_PATH = "checkpoints/final.pt"
TITAN_CONFIG_PATH = "configs/titan_config.yaml"
TITAN_DEVICE = "cpu"
