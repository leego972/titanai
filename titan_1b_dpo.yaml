# TitanAI 1B — Phase 3 Preference Fine-tuning Config
# Run AFTER instruction fine-tuning:
#   pip install trl
#   python train_dpo.py --config titan_1b_dpo.yaml
#
# DATASET: Add your own preference pairs.
# Format (JSONL, one pair per line):
#   {"prompt": "...", "chosen": "...", "rejected": "..."}
# Place the file at: data/raw/custom_prefs.jsonl
#
# "chosen"  = the response you want the model to prefer
# "rejected" = the response you want the model to move away from
# No third-party alignment data is used here.

base_model: "checkpoints/titan_1b_instruct/latest"

training:
  learning_rate: 1.0e-6
  max_steps: 1000
  beta: 0.1                  # DPO temperature — lower = closer to base model
  bf16: true
  checkpoint_dir: "checkpoints/titan_1b_dpo"
  log_interval: 25
  save_interval: 250

data:
  dataset: "custom"
  dataset_path: "data/raw/custom_prefs.jsonl"
  split: "train"
  max_seq_len: 2048

evaluation:
  val_split: "test"
  num_eval_batches: 10

logging:
  log_dir: "logs/titan_1b_dpo"
  experiment_name: "titan-1b-dpo-v01"
  wandb:
    enabled: true
    project: "titanai-dpo"
