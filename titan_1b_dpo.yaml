# TitanAI 1B — Phase 3 DPO Alignment Config
# Run AFTER instruction fine-tuning:
#   pip install trl
#   python train_dpo.py --config titan_1b_dpo.yaml

base_model: "checkpoints/titan_1b_instruct/latest"

training:
  learning_rate: 1.0e-6
  max_steps: 1000
  beta: 0.1                  # DPO temperature — lower = more conservative
  bf16: true
  checkpoint_dir: "checkpoints/titan_1b_dpo"
  log_interval: 25
  save_interval: 250

data:
  dataset: "HuggingFaceH4/ultrafeedback_binarized"
  split: "train_prefs"
  max_seq_len: 2048

evaluation:
  val_split: "test_prefs"
  num_eval_batches: 10

logging:
  log_dir: "logs/titan_1b_dpo"
  experiment_name: "titan-1b-dpo-v01"
  wandb:
    enabled: true
    project: "titanai-dpo"
