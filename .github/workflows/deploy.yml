name: Deploy to Railway

# Manual only. This used to run on every push to main; run it from the Actions
# tab when a Railway deploy is actually wanted.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy TitanAI inference server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service titanai-server --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
