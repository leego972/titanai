name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  health-check:
    name: Repository Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm repository checkout
        run: |
          echo "TitanAI repository checked out successfully."
          echo "CI is intentionally minimal while the training pipeline is under active development."
          test -f configs/titan_config.yaml
          test -f model/titan_model.py
          test -f training/trainer.py
          test -f tokenizer/train_tokenizer.py
          echo "Required core files are present."
