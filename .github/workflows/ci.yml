name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'model/**'
      - 'training/**'
      - 'tokenizer/**'
      - 'inference/**'
      - 'evaluation/**'
      - 'api/**'
      - 'scripts/**'
      - 'data/**'
      - 'configs/**'
      - 'requirements*.txt'
      - '.github/workflows/ci.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [main, master]

jobs:
  lint-and-syntax-check:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip ruff pyyaml

      - name: Ruff lint check - advisory
        continue-on-error: true
        run: |
          echo "Running Ruff lint in advisory mode. Functional blockers are handled by syntax/YAML checks."
          ruff check model/ training/ tokenizer/ inference/ evaluation/ api/ scripts/ data/ --ignore E501 || true

      - name: Ruff format check - advisory
        continue-on-error: true
        run: |
          echo "Running Ruff format check in advisory mode."
          ruff format --check model/ training/ tokenizer/ inference/ evaluation/ api/ scripts/ data/ || true

      - name: Validate YAML configs parse
        run: |
          python - <<'PY'
          import glob
          import sys
          import yaml

          configs = glob.glob('configs/*.yaml')
          if not configs:
              print('No configs found', file=sys.stderr)
              sys.exit(1)

          for path in configs:
              with open(path, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print(f'  OK YAML: {path}')
          print(f'All {len(configs)} config file(s) parse as YAML')
          PY

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          import glob
          import sys

          patterns = [
              'model/**/*.py',
              'training/**/*.py',
              'tokenizer/**/*.py',
              'inference/**/*.py',
              'evaluation/**/*.py',
              'api/**/*.py',
              'scripts/**/*.py',
              'data/**/*.py',
          ]
          files = []
          for pattern in patterns:
              files.extend(glob.glob(pattern, recursive=True))

          errors = []
          for path in sorted(set(files)):
              try:
                  with open(path, encoding='utf-8') as fh:
                      ast.parse(fh.read())
              except SyntaxError as exc:
                  errors.append(f'{path}: {exc}')

          if errors:
              for err in errors:
                  print(f'SYNTAX ERROR: {err}', file=sys.stderr)
              sys.exit(1)

          print(f'All {len(set(files))} Python file(s) have valid syntax')
          PY

  config-validation:
    name: Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate production base config only
        run: |
          python - <<'PY'
          import sys
          import yaml

          path = 'configs/titan_config.yaml'
          required_sections = ['project', 'tokenizer', 'data', 'model', 'training', 'evaluation', 'inference', 'logging']
          required_training_keys = ['clip_grad_norm', 'learning_rate', 'batch_size', 'max_steps', 'warmup_steps']

          with open(path, encoding='utf-8') as fh:
              cfg = yaml.safe_load(fh)

          errors = []
          for section in required_sections:
              if section not in cfg:
                  errors.append(f'{path}: missing section [{section}]')
          train = cfg.get('training', {})
          for key in required_training_keys:
              if key not in train:
                  errors.append(f'{path}: training section missing key [{key}]')
          if 'grad_clip' in train:
              errors.append(f'{path}: dead key [training.grad_clip] found — use [clip_grad_norm] instead')

          if errors:
              for err in errors:
                  print(f'ERROR: {err}', file=sys.stderr)
              sys.exit(1)

          print(f'{path} passed required config validation')
          PY
