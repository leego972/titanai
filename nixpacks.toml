providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "ffmpeg"]

[phases.install]
cmds = [
    "python3 -m venv /opt/venv",
    "/opt/venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu",
    "/opt/venv/bin/pip install -r requirements-api.txt",
    "printf '\\nPATH=/opt/venv/bin:$PATH' >> /root/.profile"
]

[start]
cmd = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
