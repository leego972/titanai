providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "ffmpeg"]

[phases.install]
cmds = [
    "pip install torch --index-url https://download.pytorch.org/whl/cpu",
    "pip install -r requirements-api.txt"
]

[start]
cmd = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
