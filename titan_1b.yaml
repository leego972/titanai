# TitanAI 1B — Pretraining Config v0.8 (Single-GPU + Multi-GPU Auto)
# Single GPU: batch=4 x accum=32 x 2048 = 262,144 tokens/step
# Multi-GPU:  batch=4 x accum=8  x N GPUs x 2048 = same effective batch (N=4)
# max_steps=76293 → 20B tokens either way

project:
  name: "titan-1b"
  version: "0.8.0"

model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 2048
  n_heads: 16
  n_kv_heads: 4
  n_layers: 24
  d_ff: 8192
  max_seq_len: 2048
  rope_base: 500000.0
  dropout: 0.05
  tie_embeddings: true
  gradient_checkpointing: true
  use_flash_attention: true

training:
  batch_size: 4
  gradient_accumulation_steps: 32    # 32 for 1 GPU; set to 8 for 4-GPU runs
  learning_rate: 2.0e-4
  weight_decay: 0.01
  max_steps: 76293                   # 20B tokens: 76293 x 262144 = 20B
  warmup_steps: 1500
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 100
  eval_interval: 2000
  save_interval: 5000
  checkpoint_dir: "checkpoints/titan_1b_pretrain"
  use_8bit_adam: true
  use_compile: true
  bf16: true
  resume_from: null

tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000

data:
  processed_dir: "data/processed"
  max_seq_len: 2048

evaluation:
  val_batch_size: 2
  num_eval_batches: 50
  perplexity_threshold: 12.0

logging:
  log_dir: "logs/titan_1b"
  experiment_name: "titan-1b-pretrain-v08-auto"
  wandb:
    enabled: false
    project: "titanai"

inference:
  default_max_new_tokens: 512
  default_temperature: 0.7
  default_top_k: 50
  default_top_p: 0.95
