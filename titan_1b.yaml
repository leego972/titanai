# TitanAI 1B — Pretraining Config v0.4
# ============================================================
# Architecture: d_model=2048, n_heads=16, n_kv_heads=4 (GQA), n_layers=24
# Activation  : SwiGLU (hidden=5504)
# Norm        : RMSNorm
# Positional  : RoPE (base=500000 — extended context ready)
# Attention   : FlashAttention-2 → PyTorch SDPA → manual fallback
# Requirements: A100 40GB (tight) | A100 80GB (comfortable) | 2x RTX 4090 DDP
#
# CHANGES FROM v0.3:
#   [FIX 1] learning_rate   : 5.0e-5  → 2.0e-4   (was too low; slow convergence risk)
#   [FIX 2] warmup_steps    : 500     → 1500      (safer ramp-up at 1B scale)
#   [FIX 3] rope_base       : 10000   → 500000    (LLaMA-3 style; future context ext.)
#   [FIX 4] max_steps note  : updated to flag Chinchilla optimal at ~305k steps / 20B tokens
#
# Token budget at these settings:
#   effective_batch = batch_size(1) × grad_accum(32) × seq_len(2048) = 65,536 tokens/step
#   max_steps(150000) × 65,536 = ~9.8 billion tokens  ← strong first checkpoint
#   Chinchilla optimal for 1B params ≈ 305,000 steps  ← ~20B tokens, production quality
