# TitanAI 1B — Pretraining Config v0.5 (ALL IMPROVEMENTS APPLIED)
# ============================================================
# Architecture: d_model=2048, n_heads=16, n_kv_heads=4 (GQA), n_layers=24
# Activation  : SwiGLU (hidden=5504)
# Norm        : RMSNorm
# Positional  : RoPE (base=500000 — extended context ready)
# Attention   : FlashAttention-2 → PyTorch SDPA → manual fallback
# Requirements: A100 40GB (tight) | A100 80GB (comfortable) | 2x RTX 4090 DDP
#
# CHANGES FROM v0.4:
#   [IMP 1] max_steps      : 150000 → 305000  (Chinchilla optimal: ~20B tokens)
#   [IMP 2] use_flash_attention: true          (Flash Attention 2 — 2-3x speedup)
#
# CHANGES FROM v0.3 (retained):
#   [FIX 1] learning_rate   : 5.0e-5  → 2.0e-4
#   [FIX 2] warmup_steps    : 500     → 1500
#   [FIX 3] rope_base       : 10000   → 500000
#   [FIX 4] wandb enabled
#
# Token budget at max_steps=305000:
#   effective_batch = batch_size(1) × grad_accum(32) × seq_len(2048) = 65,536 tokens/step
#   305000 × 65,536 = ~20B tokens = Chinchilla optimal for 1B params
#
# Cost estimate on Vast.ai (spot):
#   RTX 4090 solo  : ~28 hrs → ~$12  (with FlashAttention-2)
#   A100 40GB SXM  : ~18 hrs → ~$31
#   L40S           : ~18 hrs → ~$50  (recommended)
#
# PRE-TRAINING SETUP (run on Vast.ai BEFORE starting training):
#   pip install flash-attn --no-build-isolation
#   pip install triton>=2.2.0

project:
  name: "titan-1b"
  version: "0.5.0"

model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 2048
  n_heads: 16
  n_kv_heads: 4          # GQA: 4 KV heads shared across 16 Q heads (4× KV cache savings)
  n_layers: 24
  d_ff: 8192             # SwiGLU hidden = (2/3 × 8192) → 5504 (auto-computed)
  max_seq_len: 2048
  rope_base: 500000.0    # NTK-aware long-context ready. Safe to extend to 8k+ post-training.
  dropout: 0.05
  tie_embeddings: true
  gradient_checkpointing: true   # Essential for A100 40GB
  use_flash_attention: true      # IMP 2: FlashAttention-2. Run: pip install flash-attn --no-build-isolation

training:
  batch_size: 1
  gradient_accumulation_steps: 32   # Effective batch = 65,536 tokens/step
  learning_rate: 2.0e-4             # Standard for 1B from-scratch runs (LLaMA-1/Mistral reference)
  weight_decay: 0.01
  max_steps: 305000                 # IMP 1: was 150000. Chinchilla optimal ~20B tokens for 1B params.
  warmup_steps: 1500                # 0.5% of max_steps = safe 1B ramp-up
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1                 # Final LR = 2.0e-4 × 0.1 = 2.0e-5
  clip_grad_norm: 1.0
  log_interval: 100
  eval_interval: 2000
  save_interval: 5000
  checkpoint_dir: "checkpoints/titan_1b_pretrain"
  use_8bit_adam: true
  use_compile: true
  bf16: true
  resume_from: null                 # Set to checkpoint path to resume

tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000

data:
  processed_dir: "data/processed"
  max_seq_len: 2048

evaluation:
  val_batch_size: 1
  num_eval_batches: 50
  perplexity_threshold: 12.0        # Gate threshold before 3B upscale is approved

logging:
  log_dir: "logs/titan_1b"
  experiment_name: "titan-1b-pretrain-v05"
  wandb:
    enabled: true
    project: "titanai"

inference:
  default_max_new_tokens: 512
  default_temperature: 0.7
  default_top_k: 50
  default_top_p: 0.95
