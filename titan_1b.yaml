# TitanAI 1B — Pretraining Config v0.6 (Blackwell Optimised)
# GPU Target  : 4x RTX PRO 6000 Blackwell WS — 97.8GB VRAM each (391GB total)
# Effective batch: 8 x 4 accum x 4 GPUs x 2048 seq = 262,144 tokens/step

project:
  name: "titan-1b"
  version: "0.6.0"

model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 2048
  n_heads: 16
  n_kv_heads: 4
  n_layers: 24
  d_ff: 8192
  max_seq_len: 2048
  rope_base: 500000.0
  dropout: 0.05
  tie_embeddings: true
  gradient_checkpointing: false
  use_flash_attention: true

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  max_steps: 76293
  warmup_steps: 1500
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 100
  eval_interval: 2000
  save_interval: 5000
  checkpoint_dir: "checkpoints/titan_1b_pretrain"
  use_8bit_adam: true
  use_compile: true
  bf16: true
  resume_from: null

tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000

data:
  processed_dir: "data/processed"
  max_seq_len: 2048

evaluation:
  val_batch_size: 4
  num_eval_batches: 50
  perplexity_threshold: 12.0

logging:
  log_dir: "logs/titan_1b"
  experiment_name: "titan-1b-pretrain-v06-blackwell"
  wandb:
    enabled: false
    project: "titanai"

inference:
  default_max_new_tokens: 512
  default_temperature: 0.7
  default_top_k: 50
  default_top_p: 0.95
