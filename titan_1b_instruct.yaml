# TitanAI 1B — Phase 2 Instruction Fine-tuning Config
# Run AFTER pretraining completes:
#   python prepare_data.py --phase 2
#   python train_1b.py --config titan_1b_instruct.yaml
#
# Dataset mix:
#   50%  WizardCoder-Evol  — complex coding instruction pairs
#   50%  custom_instruct   — YOUR pairs (data/raw/custom_instruct.jsonl)
#
# Add your own prompt/response pairs to data/raw/custom_instruct.jsonl:
#   {"prompt": "...", "response": "..."}

base_model: "checkpoints/titan_1b_pretrain/latest"

training:
  learning_rate: 5.0e-5
  warmup_steps: 100
  max_steps: 5000
  batch_size: 2
  gradient_accumulation_steps: 16
  lr_scheduler: "cosine"
  bf16: true
  use_8bit_adam: true
  checkpoint_dir: "checkpoints/titan_1b_instruct"
  clip_grad_norm: 1.0
  log_interval: 50
  eval_interval: 500
  save_interval: 1000

data:
  processed_dir: "data/processed"
  sources:
    - "wizardcoder"
    - "custom_instruct"

evaluation:
  val_batch_size: 2
  num_eval_batches: 20

logging:
  log_dir: "logs/titan_1b_instruct"
  experiment_name: "titan-1b-instruct-v01"
  wandb:
    enabled: true
    project: "titanai-instruct"

inference:
  default_max_new_tokens: 700
  default_temperature: 0.6
