# TitanAI 1B — Phase 2 Instruction Fine-tuning Config
# Run AFTER pretraining completes.
# Includes: cybersecurity KB, film/post-production KB, Alpaca, Dolly, WizardCoder, custom pairs.

base_model: "checkpoints/titan_1b_pretrain/latest"

training:
  learning_rate: 5.0e-5
  warmup_steps: 100
  max_steps: 5000
  batch_size: 2
  gradient_accumulation_steps: 16
  lr_scheduler: "cosine"
  bf16: true
  use_8bit_adam: true
  checkpoint_dir: "checkpoints/titan_1b_instruct"
  clip_grad_norm: 1.0
  log_interval: 50
  eval_interval: 500
  save_interval: 1000

data:
  processed_dir: "data/processed"
  sft_files:
    - "data/sft/knowledge_base_cyber_film.jsonl"
    - "data/sft/alpaca_cleaned.jsonl"
    - "data/sft/dolly_15k.jsonl"
  sources:
    - "wizardcoder"
    - "custom_instruct"
    - "knowledge_base_cyber_film"

evaluation:
  val_batch_size: 2
  num_eval_batches: 20

logging:
  log_dir: "logs/titan_1b_instruct"
  experiment_name: "titan-1b-instruct-v01"
  wandb:
    enabled: true
    project: "titanai-instruct"

inference:
  default_max_new_tokens: 700
  default_temperature: 0.6
