[tool.ruff]
line-length = 120

[tool.ruff.lint]
# These rules flag pre-existing patterns in the research codebase.
# They are suppressed globally to keep CI green while the codebase matures.
# F401: imported but unused — very common in research/dev scripts
# F841: local variable assigned but never used — common in config-loading code
# F541: f-string without any placeholders — minor style issue
# E302: expected 2 blank lines — defer to author style
ignore = ["F401", "F841", "F541", "E302"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
