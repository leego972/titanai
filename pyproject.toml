[tool.ruff]
line-length = 120

[tool.ruff.lint]
# These rules flag pre-existing patterns in the research codebase.
# They are suppressed globally to keep CI focused on functional blockers.
ignore = [
  "F401", # imported but unused
  "F841", # local variable assigned but never used
  "F541", # f-string without placeholders
  "E302", # expected 2 blank lines
  "E401", # multiple imports on one line
  "E402", # module import not at top of file after sys.path edits
  "E701", # multiple statements on one line
  "E702", # multiple statements on one line
  "E722", # bare except in research scripts
  "F821", # unresolved names in optional/dev-only scripts
  "UP006", # typing.List compatibility style
  "UP007", # Optional[...] compatibility style
  "UP035"  # deprecated typing imports style
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
