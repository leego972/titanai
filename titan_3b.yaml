# TitanAI 3B — Pretraining Config v1.0 (Upscaled from 1B)
# ============================================================
# Architecture: DEPTH SCALING — same d_model=2048/heads/ff as 1B, more layers
#   n_layers: 24 → 66  →  ~2.9B parameters
#
# Init: upscale_to_3b.py cycles trained 1B layers across 66 slots
#
# Token budget: 40B tokens
#   tokens/step = 8 x 4 accum x 4 GPUs x 2048 seq = 262,144
#   max_steps   = 40B / 262,144 = 152,588
#
# Cost vs 1B on same hardware:
#   steps ratio:    152,588 / 76,293  = 2.0x
#   time/step ratio: 66 / 24 layers   = 2.75x
#   total:           ~5.5x the 1B cost
#   vs from-scratch 3B: would be 9x the 1B cost

project:
  name: "titan-3b"
  version: "1.0.0"

model:
  architecture: "decoder_transformer"
  vocab_size: 32000
  d_model: 2048
  n_heads: 16
  n_kv_heads: 4
  n_layers: 66
  d_ff: 8192
  max_seq_len: 2048
  rope_base: 500000.0
  dropout: 0.05
  tie_embeddings: true
  gradient_checkpointing: false
  use_flash_attention: true

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_steps: 152588
  warmup_steps: 500
  lr_scheduler: "cosine"
  lr_min_ratio: 0.1
  clip_grad_norm: 1.0
  log_interval: 100
  eval_interval: 2000
  save_interval: 5000
  checkpoint_dir: "checkpoints/titan_3b_pretrain"
  use_8bit_adam: true
  use_compile: true
  bf16: true
  resume_from: null

tokenizer:
  path: "tokenizer/artifacts_v32k/tokenizer.json"
  vocab_size: 32000

data:
  processed_dir: "data/processed"
  max_seq_len: 2048

evaluation:
  val_batch_size: 4
  num_eval_batches: 50
  perplexity_threshold: 10.0

logging:
  log_dir: "logs/titan_3b"
  experiment_name: "titan-3b-pretrain-v10-upscaled"
  wandb:
    enabled: false
    project: "titanai"

inference:
  default_max_new_tokens: 512
  default_temperature: 0.7
  default_top_k: 50
  default_top_p: 0.95
